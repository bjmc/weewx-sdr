[project]
name = "weewx-sdr"
version = "0.96b1"
description = "Weewx extension that captures data from software-defined radios."
author = "Matthew Wall"
readme = "readme"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "weewx>=5.5.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", ".env"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["bin"]
