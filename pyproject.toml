[project]
name = "weewx-sdr"
version = "0.96b1"
description = "Weewx extension that captures data from software-defined radios."
authors = [{ name = "Matthew Wall" }]
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["license"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[dependency-groups]
dev = [
    "nox>=2026.8.17",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "weewx>=5.5.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".env"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["bin"]
